version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - studio-service
      - workflow-engine
    networks:
      - leo-ai-network

  # Redis (shared cache & queue)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - leo-ai-network

  # Studio Service
  studio-service:
    build:
      context: ../backend/studio-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    volumes:
      - ../backend/packages/shared:/app/packages/shared:ro
    networks:
      - leo-ai-network

  # Workflow Engine
  workflow-engine:
    build:
      context: ../backend/workflow-engine
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - leo-ai-network

  # AI Agent Service
  ai-agent-service:
    build:
      context: ../backend/ai-agent-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - leo-ai-network

  # Integration Service
  integration-service:
    build:
      context: ../backend/integration-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=production
    networks:
      - leo-ai-network

  # Export Service
  export-service:
    build:
      context: ../backend/export-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
    networks:
      - leo-ai-network

  # Python Service
  python-service:
    build:
      context: ../python-service
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
    networks:
      - leo-ai-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

volumes:
  redis-data:

networks:
  leo-ai-network:
    driver: bridge
